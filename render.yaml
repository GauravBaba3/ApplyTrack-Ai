services:
  # 1. Web Service (Django API)
  - type: web
    name: applytrack-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && bash ../scripts/deploy_backend.sh"
    startCommand: "bash ../scripts/start_web.sh"
    envVars:
      - fromGroup: applytrack-shared-env
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "False"

  # 2. Background Worker Service (Email Processing & Multi-Tier AI Cascade)
  - type: worker
    name: applytrack-worker
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash ../scripts/start_worker.sh"
    envVars:
      - fromGroup: applytrack-shared-env
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WORKER_ID
        value: worker-prod-01
      - key: POLL_INTERVAL
        value: "5"

  # 3. Scheduled Cron Job: Incremental Gmail Sync (Every 15 minutes)
  - type: cron
    name: applytrack-sync-gmail
    runtime: python
    rootDir: backend
    schedule: "*/15 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py sync_gmail_incremental"
    envVars:
      - fromGroup: applytrack-shared-env
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"

  # 4. Scheduled Cron Job: P3 Anti-Starvation & Aging (Hourly)
  - type: cron
    name: applytrack-p3-aging
    runtime: python
    rootDir: backend
    schedule: "0 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py reprocess_p3_queue"
    envVars:
      - fromGroup: applytrack-shared-env
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"

  # 5. Scheduled Cron Job: 90-Day Raw Email Backblaze B2 Retention Pruning (Daily at 03:00 UTC)
  - type: cron
    name: applytrack-prune-retention
    runtime: python
    rootDir: backend
    schedule: "0 3 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py prune_raw_emails"
    envVars:
      - fromGroup: applytrack-shared-env
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"

# Shared Environment Variable Group across Web, Worker, and Cron services
envVarGroups:
  - name: applytrack-shared-env
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
